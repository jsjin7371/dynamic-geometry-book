name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile
        run: javac -encoding UTF-8 --release 11 -d out $(find src -name '*.java')
      - name: Validate content (data/*.csv)
        run: java -Djava.awt.headless=true -cp out geomystery.tools.ContentValidator
